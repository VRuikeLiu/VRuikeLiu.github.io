<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruike Liu</title>
<style>
:root{
  --bg:#f4f7f8; --surface:#fff; --ink:#15232a; --ink-2:#495b65; --ink-3:#636f7e;
  --accent:#3c6e91; --rule:rgba(19,37,45,.11);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --surface:#151d23; --ink:#e8eef1; --ink-2:#a8b7c0; --ink-3:#8494a0;
    --accent:#7fb0cf; --rule:rgba(255,255,255,.12);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:47rem;margin:0 auto;padding:3rem 1.25rem 5rem}
.crumb{font-size:.875rem;color:var(--ink-3);margin-bottom:2rem}
.crumb a{color:var(--accent);text-decoration:none}
.crumb a:hover{text-decoration:underline}
h1{font-size:clamp(1.75rem,4vw,2.4rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 1.5rem}
h2{font-size:1.3rem;letter-spacing:-.01em;margin:2.75rem 0 .75rem;padding-top:1.25rem;border-top:1px solid var(--rule)}
h3{font-size:1.05rem;margin:1.75rem 0 .5rem}
p,li{color:var(--ink-2)}
a{color:var(--accent)}
strong{color:var(--ink)}
blockquote{margin:1.5rem 0;padding:1rem 1.25rem;background:var(--surface);
  border-left:3px solid var(--accent);border-radius:.5rem}
blockquote p{margin:.5rem 0;font-size:.925rem}
blockquote p:first-child{margin-top:0} blockquote p:last-child{margin-bottom:0}
code{background:var(--surface);padding:.15em .4em;border-radius:.3em;font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
table{width:100%;border-collapse:collapse;margin:1.25rem 0;font-size:.9rem;display:block;overflow-x:auto}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--ink);font-weight:600}
hr{border:0;border-top:1px solid var(--rule);margin:2.5rem 0}
ul,ol{padding-left:1.35rem}
li{margin:.35rem 0}
footer{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--rule);
  font-size:.85rem;color:var(--ink-3)}

.card{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:.75rem;
  padding:1.1rem 1.25rem;margin:.75rem 0;text-decoration:none;transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:.2rem}
.card span{color:var(--ink-3);font-size:.9rem}
</style>
</head>
<body><div class="wrap">
<h1>Ruike Liu</h1>
<p>Cognitive science, computational neuroscience, and things I build.</p>

<a class="card" href="/why-we-buy/"><b>Why We Buy</b><span>An interactive Art Deco essay on advertising and consumerism in the Roaring Twenties</span></a>
<a class="card" href="/psyched/"><b>Psyched</b><span>An iOS app that turns pre-exam nerves into fuel — support and legal</span></a>
<footer>Ruike Liu &middot; <a href="mailto:PsychedSupportTeam@gmail.com">PsychedSupportTeam@gmail.com</a></footer>
</div></body></html>
